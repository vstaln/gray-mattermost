[package]
name = "gray-mattermost"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "mattermost plugin for the gray agent harness"
license = "MIT"
[lib]
name = "mattermost_plugin"
path = "src/lib.rs"
[[bin]]
name = "mattermost"
path = "src/main.rs"
[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }
